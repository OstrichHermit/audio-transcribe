[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcribe-cli-mcp"
version = "0.1.1"
description = "音视频转文字 CLI / MCP Server：阿里云百炼录音文件识别，支持说话人分离与微信语音 SILK"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OstrichHermit" }]
requires-python = ">=3.10"
keywords = ["asr", "speech-to-text", "transcription", "dashscope", "qwen", "audio", "video", "mcp", "whisper-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "dashscope",
]

[project.urls]
Homepage = "https://github.com/OstrichHermit/audio-transcribe-cli-mcp"
Issues = "https://github.com/OstrichHermit/audio-transcribe-cli-mcp/issues"

[project.scripts]
asr = "audio_transcribe_cli.cli:main"
audio-transcribe-mcp = "audio_transcribe_cli.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
